<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2048</title>
    <style>
        :root {
            --bg: #faf8ef;
            --panel: #bbada0;
            --empty: #cdc1b4;
            --text: #776e65;
            --light-text: #f9f6f2;
            --cell-2: #eee4da;
            --cell-4: #ede0c8;
            --cell-8: #f2b179;
            --cell-16: #f59563;
            --cell-32: #f67c5f;
            --cell-64: #f65e3b;
            --cell-128: #edcf72;
            --cell-256: #edcc61;
            --cell-512: #edc850;
            --cell-1024: #edc53f;
            --cell-2048: #edc22e;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f4efe7, #dfe7f8);
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
        }

        .game-wrap {
            width: min(92vw, 520px);
            background: rgba(255,255,255,0.32);
            border: 1px solid rgba(0,0,0,0.06);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 20px 48px rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.6rem, 7vw, 4rem);
            letter-spacing: -2px;
            font-weight: 900;
            color: #776e65;
        }

        .score-panel {
            display: flex;
            gap: 8px;
        }

        .score-box {
            min-width: 92px;
            text-align: center;
            background: var(--panel);
            color: var(--light-text);
            border-radius: 11px;
            padding: 10px 11px;
            box-shadow: inset 0 -2px 0 rgba(0,0,0,0.08);
        }

        .label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            opacity: 0.9;
            letter-spacing: 0.08em;
        }

        .value {
            display: block;
            margin-top: 4px;
            font-size: 1.4rem;
            font-weight: 800;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .subtitle {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
        }

        button {
            border: none;
            background: #8f7a66;
            color: white;
            border-radius: 12px;
            padding: 12px 16px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.12s ease;
        }

        button:active {
            transform: scale(0.98);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            background: var(--panel);
            border-radius: 16px;
            padding: 12px;
            aspect-ratio: 1;
            box-shadow: inset 0 2px 0 rgba(255,255,255,0.12);
        }

        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--empty);
            border-radius: 10px;
            font-size: clamp(1.2rem, 4vw, 2.5rem);
            font-weight: 800;
            color: transparent;
            transition: all 0.12s ease;
            text-shadow: none;
        }

        .cell[data-value='2'] { background: var(--cell-2); color: var(--text); }
        .cell[data-value='4'] { background: var(--cell-4); color: var(--text); }
        .cell[data-value='8'] { background: var(--cell-8); color: var(--light-text); }
        .cell[data-value='16'] { background: var(--cell-16); color: var(--light-text); }
        .cell[data-value='32'] { background: var(--cell-32); color: var(--light-text); }
        .cell[data-value='64'] { background: var(--cell-64); color: var(--light-text); }
        .cell[data-value='128'] { background: var(--cell-128); color: var(--light-text); font-size: clamp(1.05rem, 3vw, 2.2rem); }
        .cell[data-value='256'] { background: var(--cell-256); color: var(--light-text); font-size: clamp(1.05rem, 3vw, 2.2rem); }
        .cell[data-value='512'] { background: var(--cell-512); color: var(--light-text); font-size: clamp(1.05rem, 3vw, 2.2rem); }
        .cell[data-value='1024'] { background: var(--cell-1024); color: var(--light-text); font-size: clamp(0.9rem, 2.5vw, 1.8rem); }
        .cell[data-value='2048'] { background: var(--cell-2048); color: var(--light-text); font-size: clamp(0.9rem, 2.5vw, 1.8rem); }

        .status {
            min-height: 22px;
            margin-top: 14px;
            text-align: center;
            font-size: 0.92rem;
            font-weight: 700;
            color: #8f7a66;
        }

        @media (max-width: 520px) {
            .game-wrap {
                padding: 14px;
                border-radius: 18px;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            button {
                width: 100%;
            }

            .score-panel {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="game-wrap">
        <div class="topbar">
            <h1>2048</h1>
            <div class="score-panel">
                <div class="score-box">
                    <span class="label">Score</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="score-box">
                    <span class="label">Best</span>
                    <span id="best" class="value">0</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <p class="subtitle">Join the numbers and reach 2048!</p>
            <button id="restartBtn" type="button">New Game</button>
        </div>

        <div id="board" class="board" aria-label="2048 game board"></div>
        <div id="status" class="status" aria-live="polite"></div>
    </div>

    <script>
        const SIZE = 4;
        let board = [];
        let score = 0;
        let bestScore = Number(localStorage.getItem('2048-best') || 0);
        let gameWon = false;
        let gameOver = false;
        let statusMessage = 'Use arrow keys or swipe to play.';

        const boardEl = document.getElementById('board');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const statusEl = document.getElementById('status');

        document.getElementById('restartBtn').addEventListener('click', startGame);

        function startGame() {
            board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
            score = 0;
            gameWon = false;
            gameOver = false;
            statusMessage = 'Use arrow keys or swipe to play.';
            addRandomTile();
            addRandomTile();
            render();
        }

        function addRandomTile() {
            const emptyCells = [];
            for (let y = 0; y < SIZE; y++) {
                for (let x = 0; x < SIZE; x++) {
                    if (board[y][x] === 0) emptyCells.push({ x, y });
                }
            }

            if (!emptyCells.length) return;

            const { x, y } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            board[y][x] = Math.random() < 0.9 ? 2 : 4;
        }

        function render() {
            boardEl.innerHTML = '';

            for (let y = 0; y < SIZE; y++) {
                for (let x = 0; x < SIZE; x++) {
                    const value = board[y][x];
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.value = String(value);
                    cell.textContent = value === 0 ? '' : value;
                    boardEl.appendChild(cell);
                }
            }

            scoreEl.textContent = String(score);
            bestEl.textContent = String(bestScore);
            statusEl.textContent = statusMessage;
        }

        function move(direction) {
            if (gameOver) {
                statusMessage = 'Game over. Press New Game to try again.';
                render();
                return;
            }

            const oldBoard = board.map(row => [...row]);
            let moved = false;

            if (direction === 'left' || direction === 'right') {
                for (let row = 0; row < SIZE; row++) {
                    const line = [...board[row]];
                    const transformed = direction === 'left' ? line : [...line].reverse();
                    const merged = mergeLine(transformed);
                    const finalLine = direction === 'left' ? merged : [...merged].reverse();

                    if (JSON.stringify(finalLine) !== JSON.stringify(board[row])) {
                        moved = true;
                    }

                    board[row] = finalLine;
                }
            } else {
                for (let col = 0; col < SIZE; col++) {
                    const line = [board[0][col], board[1][col], board[2][col], board[3][col]];
                    const transformed = direction === 'up' ? line : [...line].reverse();
                    const merged = mergeLine(transformed);
                    const finalLine = direction === 'up' ? merged : [...merged].reverse();

                    if (JSON.stringify(finalLine) !== JSON.stringify(line)) {
                        moved = true;
                    }

                    for (let row = 0; row < SIZE; row++) {
                        board[row][col] = finalLine[row];
                    }
                }
            }

            if (!moved) {
                statusMessage = 'No move possible. Try another direction.';
                render();
                return;
            }

            addRandomTile();

            if (board.flat().includes(2048) && !gameWon) {
                gameWon = true;
                statusMessage = 'You reached 2048! Keep going!';
            } else if (!hasAvailableMoves()) {
                gameOver = true;
                statusMessage = 'Game over! No more moves left.';
            } else {
                statusMessage = 'Nice move!';
            }

            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('2048-best', String(bestScore));
            }

            if (JSON.stringify(board) === JSON.stringify(oldBoard)) {
                statusMessage = 'No move possible. Try another direction.';
            }

            render();
        }

        function mergeLine(line) {
            let values = line.filter(value => value !== 0);
            const merged = [];

            for (let i = 0; i < values.length; i++) {
                if (i + 1 < values.length && values[i] === values[i + 1]) {
                    const mergedValue = values[i] * 2;
                    merged.push(mergedValue);
                    score += mergedValue;
                    i++;
                } else {
                    merged.push(values[i]);
                }
            }

            while (merged.length < SIZE) {
                merged.push(0);
            }

            return merged;
        }

        function hasAvailableMoves() {
            for (let y = 0; y < SIZE; y++) {
                for (let x = 0; x < SIZE; x++) {
                    if (board[y][x] === 0) return true;
                    if (x < SIZE - 1 && board[y][x] === board[y][x + 1]) return true;
                    if (y < SIZE - 1 && board[y][x] === board[y + 1][x]) return true;
                }
            }
            return false;
        }

        document.addEventListener('keydown', (event) => {
            const key = event.key.toLowerCase();
            const moves = {
                arrowleft: 'left',
                a: 'left',
                arrowright: 'right',
                d: 'right',
                arrowup: 'up',
                w: 'up',
                arrowdown: 'down',
                s: 'down'
            };

            if (moves[key]) {
                event.preventDefault();
                move(moves[key]);
            }
        });

        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', (event) => {
            const touch = event.changedTouches[0];
            touchStartX = touch.screenX;
            touchStartY = touch.screenY;
        }, { passive: true });

        document.addEventListener('touchend', (event) => {
            const touch = event.changedTouches[0];
            const dx = touch.screenX - touchStartX;
            const dy = touch.screenY - touchStartY;

            if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;

            if (Math.abs(dx) > Math.abs(dy)) {
                move(dx > 0 ? 'right' : 'left');
            } else {
                move(dy > 0 ? 'down' : 'up');
            }
        }, { passive: true });

        startGame();
    </script>
</body>
</html>
