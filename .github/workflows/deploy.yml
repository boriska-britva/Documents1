name: Deploy to Zone Media

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy via SFTP
        run: |
          lftp -u ${{ secrets.SSH_USER }}, sftp://${{ secrets.SSH_HOST }} <<'EOF'
          set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key"
          set net:max-retries 3
          mirror --reverse --delete --exclude-glob .git* --exclude-glob .github* . ${{ secrets.SSH_TARGET }}
          bye
          EOF
