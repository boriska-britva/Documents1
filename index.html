<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8-Bit Game Hub</title>
  <style>
    :root {
      --bg-dark: #080b12;
      --panel: rgba(20, 20, 24, 0.82);
      --panel-border: #ff6a00;
      --text: #f8f0d8;
      --red: #ff2d2d;
      --orange: #ff8a00;
      --gold: #ffd166;
      --green: #52d273;
      --blue: #6cc8ff;
    }

#test timo commit

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: var(--text);
      font-family: "Courier New", monospace;
      image-rendering: pixelated;
      user-select: none;
    }

    body {
      position: relative;
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 100, 0, 0.12), transparent 18%),
        radial-gradient(circle at 30% 30%, rgba(255, 160, 0, 0.15), transparent 26%),
        radial-gradient(circle at 70% 70%, rgba(255, 40, 0, 0.14), transparent 20%),
        linear-gradient(#06080d 0%, #0b0d12 100%);
    }

    #screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 10%, rgba(255, 150, 0, 0.32), transparent 20%),
        radial-gradient(circle at 25% 40%, rgba(255, 90, 0, 0.18), transparent 34%),
        radial-gradient(circle at 75% 60%, rgba(255, 60, 0, 0.16), transparent 30%),
        linear-gradient(180deg, #090b12 0%, #100d12 30%, #120b09 100%);
    }

    .scanlines,
    .scanlines::before {
      position: absolute;
      inset: 0;
      pointer-events: none;
      content: "";
    }

    .scanlines {
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.04),
        rgba(255,255,255,0.04) 1px,
        transparent 2px,
        transparent 4px
      );
      mix-blend-mode: screen;
      opacity: 0.7;
    }

    .fire {
      position: absolute;
      inset: -8% -8% -8% -8%;
      background:
        radial-gradient(circle at 50% 100%, rgba(255, 165, 0, 0.92) 0%, rgba(255, 96, 0, 0.8) 12%, rgba(255, 60, 0, 0.55) 18%, rgba(20, 0, 0, 0) 44%),
        radial-gradient(circle at 18% 70%, rgba(255, 120, 0, 0.8) 0%, rgba(255, 80, 0, 0.35) 18%, rgba(0,0,0,0) 40%),
        radial-gradient(circle at 82% 72%, rgba(255, 120, 0, 0.75) 0%, rgba(255, 60, 0, 0.28) 16%, rgba(0,0,0,0) 38%),
        radial-gradient(circle at 40% 35%, rgba(255, 170, 0, 0.6) 0%, rgba(255, 90, 0, 0.2) 18%, rgba(0,0,0,0) 42%),
        radial-gradient(circle at 58% 48%, rgba(255, 210, 80, 0.5) 0%, rgba(255, 120, 0, 0.18) 20%, rgba(0,0,0,0) 46%);
      filter: blur(10px) saturate(1.3);
      opacity: 1;
      animation: fireShift 7s ease-in-out infinite alternate;
    }

    .fire::before,
    .fire::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 15% 25%, rgba(255, 190, 60, 0.8), transparent 16%),
        radial-gradient(circle at 30% 60%, rgba(255, 90, 0, 0.7), transparent 18%),
        radial-gradient(circle at 55% 22%, rgba(255, 170, 0, 0.7), transparent 20%),
        radial-gradient(circle at 80% 45%, rgba(255, 120, 0, 0.75), transparent 18%),
        radial-gradient(circle at 68% 84%, rgba(255, 90, 0, 0.7), transparent 20%);
      mix-blend-mode: screen;
    }

    .fire::before {
      animation: flameWave 4s ease-in-out infinite alternate;
    }

    .fire::after {
      filter: blur(25px);
      opacity: 0.8;
      animation: flameWave 5.6s ease-in-out infinite alternate-reverse;
    }

    @keyframes flameWave {
      0% { transform: scale(0.98) translate3d(-2%, 1%, 0) rotate(-1deg); }
      50% { transform: scale(1.06) translate3d(2%, -1%, 0) rotate(1deg); }
      100% { transform: scale(1.12) translate3d(-1%, 2%, 0) rotate(-2deg); }
    }

    @keyframes fireShift {
      0% { transform: scale(1.04) translateY(0) rotate(-1deg); opacity: 0.95; }
      50% { transform: scale(1.1) translateY(2%) rotate(1deg); opacity: 1; }
      100% { transform: scale(1.15) translateY(-1%) rotate(-1deg); opacity: 0.98; }
    }

    .hud {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      padding: 24px;
    }

    .terminal {
      width: min(540px, 82vw);
      background: rgba(8, 10, 18, 0.7);
      border: 3px solid rgba(255, 120, 0, 0.9);
      box-shadow: 0 0 0 4px rgba(255, 95, 0, 0.18), 0 0 25px rgba(255, 100, 0, 0.3);
      padding: 16px 18px 20px;
      position: relative;
    }

    .terminal::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0));
      pointer-events: none;
    }

    .title {
      text-align: center;
      font-size: clamp(2.3rem, 5vw, 5rem);
      line-height: 1;
      letter-spacing: 0.18em;
      margin: 18px 0 28px;
      font-weight: 700;
      color: #ff2d2d;
      text-shadow: 0 0 8px rgba(255, 90, 0, 0.5), 3px 3px 0 rgba(90, 0, 0, 0.8);
      animation: glitch 1.2s steps(2, end) infinite alternate;
    }

    @keyframes glitch {
      0% { transform: translate(0px, 0px); text-shadow: 0 0 8px rgba(255, 50, 50, 0.8), 3px 3px 0 rgba(90, 0, 0, 0.8); }
      20% { transform: translate(-1px, 1px); }
      40% { transform: translate(1px, -1px); }
      60% { transform: translate(-1px, 0px); }
      100% { transform: translate(1px, 1px); }
    }

    .menu {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-start;
      width: 100%;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      background: rgba(15, 15, 20, 0.7);
      border: 2px solid rgba(255, 150, 0, 0.5);
      padding: 10px 12px;
      color: var(--text);
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
      text-decoration: none;
      font-size: 1.05rem;
      font-family: inherit;
      text-transform: lowercase;
    }

    .menu-item:hover,
    .menu-item:focus {
      transform: translateX(4px);
      border-color: var(--gold);
      box-shadow: 0 0 14px rgba(255, 190, 0, 0.3);
      outline: none;
    }

    .menu-item strong {
      color: var(--gold);
      font-weight: 700;
    }

    .menu-item .tag {
      color: #bfc4d4;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .menu-item .arrow {
      margin-left: auto;
      color: var(--orange);
      font-weight: 700;
    }

    .status {
      margin-top: 18px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 140, 0, 0.5);
      color: #d6d9e6;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: lowercase;
      opacity: 0.9;
    }

    .pixel {
      position: absolute;
      width: 8px;
      height: 8px;
      background: rgba(254, 130, 0, 0.8);
      box-shadow: 0 0 12px rgba(255, 85, 0, 0.8), 0 0 24px rgba(255, 160, 0, 0.4);
      animation: drift 8s linear infinite;
      opacity: 0.7;
      border-radius: 1px;
    }

    @keyframes drift {
      0% { transform: translate(0, 0) scale(0.7); opacity: 0; }
      10% { opacity: 0.8; }
      30% { transform: translate(10px, -18px) scale(1.1); }
      70% { transform: translate(-12px, -42px) scale(1.4); }
      100% { transform: translate(6px, -70px) scale(0.7); opacity: 0; }
    }

    @media (max-width: 640px) {
      .terminal {
        width: min(86vw, 470px);
        padding: 14px 12px 16px;
      }

      .menu-item {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div id="screen">
    <div class="fire"></div>
    <div class="scanlines"></div>
    <div id="embers"></div>

    <div class="hud">
      <div class="terminal">
        <div class="title">15 12</div>

        <div class="menu" aria-label="Game selection menu">
          <a href="game.html" class="menu-item" aria-label="Timo hamste">
            <span><strong>1</strong> - hamster</span>
            <span class="tag">skater</span>
            <span class="arrow">></span>
          </a>

          <a href="sniper.html" class="menu-item" aria-label="Play Sniper">
            <span><strong>2</strong> - sniper</span>
            <span class="tag">scope</span>
            <span class="arrow">></span>
          </a>
        </div>

        <div class="status">select your mission</div>
      </div>
    </div>
  </div>

  <script>
    const emberContainer = document.getElementById('embers');

    function spawnEmbers() {
      const ember = document.createElement('div');
      ember.className = 'pixel';
      const size = Math.random() * 6 + 4;
      ember.style.width = size + 'px';
      ember.style.height = size + 'px';
      ember.style.left = (Math.random() * 100) + '%';
      ember.style.bottom = '0';
      ember.style.background = 'rgba(' + (Math.random() > 0.5 ? '255,90,0' : '255,180,0') + ', 0.9)';
      ember.style.boxShadow = '0 0 12px rgba(255,120,0,0.8)';
      ember.style.animationDuration = (Math.random() * 4 + 4) + 's';
      emberContainer.appendChild(ember);

      setTimeout(() => {
        ember.remove();
      }, 7000);
    }

    for (let i = 0; i < 90; i++) {
      setTimeout(spawnEmbers, i * 70);
    }

    setInterval(spawnEmbers, 180);
  </script>
</body>
</html>
